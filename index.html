<style>

button{background:var(--panel);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer}
button.on{outline:2px solid #c0894f}
#t{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;font-size:14px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
