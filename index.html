<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>平面配置 3D 預覽</title>
<style>
:root{--bg:#f3efe9;--fg:#2b2620;--panel:rgba(255,255,255,.88);--bd:#d8cfc2;--accent:#c0894f;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#25221e;--fg:#eee6da;--panel:rgba(45,41,36,.9);--bd:#5a5249}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none;z-index:10}
#top-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%}
#t,#info{font-size:13px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:6px 11px;backdrop-filter:blur(6px);pointer-events:auto;line-height:1.4}
#info{font-weight:600;border-color:var(--accent)}
#rooms{display:flex;flex-wrap:wrap;gap:5px;pointer-events:auto;max-height:24vh;overflow-y:auto}
#rooms button{padding:5px 10px;font-size:13px;border-radius:16px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));z-index:10;pointer-events:none}
#bar button,.pan-pad button{pointer-events:auto}
button{background:var(--panel);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:7px 11px;font-size:13.5px;cursor:pointer;backdrop-filter:blur(6px);transition:transform .1s,outline-color .15s}
button:active{transform:scale(.96)}
button.on{outline:2px solid var(--accent);font-weight:600}

/* 方向平移迷你控制鈕 */
.pan-pad{display:inline-flex;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:2px 4px;backdrop-filter:blur(6px);pointer-events:auto}
.pan-pad button{border:none;background:transparent;padding:5px 8px;font-size:13px;border-radius:7px;backdrop-filter:none}
.pan-pad button:hover{background:rgba(192,137,79,.16)}

/* 預覽列印視窗 */
#printModal{position:fixed;inset:0;background:rgba(20,18,16,.72);backdrop-filter:blur(5px);z-index:50;display:none;overflow-y:auto;padding:20px 12px}
#printModal.open{display:flex;justify-content:center;align-items:flex-start}
#printSheet{background:#fff;color:#222;width:100%;max-width:820px;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.35);padding:24px 28px;box-sizing:border-box;margin:auto}
.ps-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #2b2620;padding-bottom:10px;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.ps-title{font-size:20px;font-weight:700;margin:0;color:#1f1b17}
.ps-meta{font-size:12.5px;color:#555;text-align:right;line-height:1.5}
.ps-img-wrap{border:1px solid #d5cfc7;border-radius:8px;overflow:hidden;background:#f5f2ed;margin-bottom:14px;text-align:center}
#printImg{width:100%;max-height:430px;object-fit:contain;display:block;margin:0 auto}
.ps-summary{background:#faf7f2;border-left:4px solid #c0894f;padding:8px 12px;font-size:13.5px;font-weight:600;margin-bottom:14px;color:#2b2620}
.ps-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.ps-table th,.ps-table td{border:1px solid #dcd6cd;padding:6px 10px;text-align:left}
.ps-table th{background:#f2ede4;font-weight:600;color:#2b2620}
.ps-table tr.hl{background:#fff4e4;font-weight:600}
.ps-note{font-size:11.5px;color:#666;margin:0 0 16px}
.ps-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid #e5dfd6;padding-top:14px}
.ps-actions button{background:#f5f2ed;color:#222;border:1px solid #ccc4b8;padding:8px 16px;font-size:14px;font-weight:600}
.ps-actions button.primary{background:#c0894f;color:#fff;border-color:#a8733c}

@media (max-width:640px){
  #t,#info{font-size:12px;padding:5px 9px}
  #rooms button{padding:4px 9px;font-size:12px}
  button{padding:6px 8px;font-size:12px;border-radius:8px}
  .pan-pad button{padding:4px 7px;font-size:12px}
  #printSheet{padding:16px}
  .ps-title{font-size:17px}
}

@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff !important;overflow:visible !important}
  #c,#hud,#bar,.ps-actions{display:none !important}
  #printModal{position:static !important;display:block !important;background:none !important;padding:0 !important;overflow:visible !important}
  #printSheet{box-shadow:none !important;border-radius:0 !important;max-width:100% !important;padding:0 !important}
  #printImg{max-height:360px !important}
}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="top-row">
    <div id="t">拖曳旋轉 ・ 右鍵/雙指平移 ・ 滾輪縮放</div>
    <div id="info"></div>
  </div>
  <div id="rooms"></div>
</div>
<div id="bar">
  <button id="mode">✋ 模式:旋轉</button>
  <div class="pan-pad" title="畫面平移 (支援方向鍵 / WASD)">
    <button id="pl" aria-label="向左平移">⬅</button>
    <button id="pu" aria-label="向上平移">⬆</button>
    <button id="pd" aria-label="向下平移">⬇</button>
    <button id="pr" aria-label="向右平移">➡</button>
  </div>
  <button id="l">⟲ 左轉</button><button id="r">右轉 ⟳</button>
  <button id="zi">＋</button><button id="zo">－</button>
  <button id="auto">自動旋轉</button><button id="wall" class="on">牆體:全高</button>
  <button id="dimBtn" class="on">📐 尺寸</button>
  <button id="dn">🌙 夜晚</button><button id="lab" class="on">名稱</button>
  <button id="eye">👁 人視角</button><button id="top">俯視</button><button id="iso">預設視角</button>
  <button id="printBtn">🖨 預覽列印</button>
</div>

<!-- 預覽列印彈窗 -->
<div id="printModal" role="dialog" aria-modal="true" aria-labelledby="psTitle">
  <div id="printSheet">
    <div class="ps-head">
      <h2 class="ps-title" id="psTitle">平面配置 3D 預覽與尺寸報告</h2>
      <div class="ps-meta" id="psMeta"></div>
    </div>
    <div class="ps-img-wrap">
      <img id="printImg" alt="3D 平面配置預覽圖">
    </div>
    <div class="ps-summary" id="psSummary"></div>
    <table class="ps-table">
      <thead>
        <tr><th>空間區域</th><th>概略面寬 × 深度</th><th>概算面積</th><th>概算坪數</th></tr>
      </thead>
      <tbody id="psBody"></tbody>
    </table>
    <p class="ps-note">※ 以上尺寸與坪數係依原始平面圖比例尺等比例換算之概略參考值，實際施工與訂製家具仍請以現場雷射丈量為準。</p>
    <div class="ps-actions">
      <button id="dlImgBtn">📥 下載圖檔 (PNG)</button>
      <button id="doPrintBtn" class="primary">🖨 立即列印 / 另存 PDF</button>
      <button id="closePrintBtn">✕ 關閉預覽</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const S=1/127.5,CX=1137,CY=812,WH=2.45,T=8;
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
const sc=new THREE.Scene();sc.background=new THREE.Color(dark?0x25221e:0xd8d2c7);
const cam=new THREE.PerspectiveCamera(40,1,.1,200);
const ctl=new THREE.OrbitControls(cam,cv);
ctl.enableDamping=true;ctl.enablePan=true;ctl.screenSpacePanning=true;ctl.panSpeed=1.1;
ctl.maxPolarAngle=Math.PI/2.03;ctl.minDistance=1.5;ctl.maxDistance=60;

// 鏡頭平滑移動狀態
let goalPos=null,goalTgt=null;
function flyTo(pos,tgt,instant=false){
  if(instant){
    cam.position.copy(pos);ctl.target.copy(tgt);ctl.update();
    goalPos=null;goalTgt=null;
  }else{
    goalPos=pos.clone();goalTgt=tgt.clone();
  }
}
ctl.addEventListener('start',()=>{goalPos=null;goalTgt=null});

function iso(instant=false){
  ctl.maxPolarAngle=Math.PI/2.03;
  flyTo(new THREE.Vector3(0,14,13),new THREE.Vector3(0,0,0),instant);
}
iso(true);

const hemi=new THREE.HemisphereLight(0xfff4e6,0x8a7a6a,.5);sc.add(hemi);
const d=new THREE.DirectionalLight(0xfff0dd,.9);d.position.set(-9,12,6);d.castShadow=true;
d.shadow.mapSize.set(2048,2048);Object.assign(d.shadow.camera,{left:-14,right:14,top:14,bottom:-14,far:50});d.shadow.bias=-.0005;sc.add(d);

// materials & textures
const mats={};
const glass=new THREE.MeshStandardMaterial({color:0x9cc8e0,transparent:true,opacity:.3,roughness:.1});
const lampShadeMat=new THREE.MeshStandardMaterial({color:0xefe3c8,roughness:.45,emissive:0xffc978,emissiveIntensity:.12});
const lampBulbMat=new THREE.MeshStandardMaterial({color:0xfff6dc,roughness:.2,emissive:0xffdf9e,emissiveIntensity:.3});

function mat(c,r=.8){if(c==='glass')return glass;if(c&&c.isMaterial)return c;return mats[c+r]||(mats[c+r]=new THREE.MeshStandardMaterial({color:c,roughness:r}))}
function cvs(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
const TX={
wood:cvs(256,256,(g,w,h)=>{const n=8,ph=h/n;for(let i=0;i<n;i++){const l=66+Math.random()*8;g.fillStyle=`hsl(33,48%,${l}%)`;const off=Math.random()*w;g.fillRect(0,i*ph,w,ph);
  g.fillStyle='rgba(120,80,40,.10)';for(let k=0;k<14;k++)g.fillRect(Math.random()*w,i*ph+Math.random()*ph,30+Math.random()*60,1);
  g.fillStyle='rgba(90,60,30,.5)';g.fillRect(0,i*ph,w,1.5);g.fillRect(off,i*ph,1.5,ph)}}),
tile:cvs(128,128,(g,w,h)=>{g.fillStyle='#a2a29e';g.fillRect(0,0,w,h);g.strokeStyle='#7d7d79';g.lineWidth=3;g.strokeRect(0,0,w,h);g.strokeRect(w/2,0,0,h);g.strokeRect(0,h/2,w,0)}),
deck:cvs(128,128,(g,w,h)=>{for(let i=0;i<8;i++){g.fillStyle=`hsl(28,40%,${50+Math.random()*6}%)`;g.fillRect(i*16,0,16,h);g.fillStyle='rgba(60,30,10,.5)';g.fillRect(i*16,0,1.5,h)}}),
stone:cvs(128,128,(g,w,h)=>{g.fillStyle='#bdb6aa';g.fillRect(0,0,w,h);g.strokeStyle='#9a9387';g.lineWidth=2;g.strokeRect(0,0,w,h);g.strokeRect(w/2,0,0,h)}),
bt:cvs(128,128,(g,w,h)=>{g.fillStyle='#8f8f8c';g.fillRect(0,0,w,h);g.strokeStyle='#707070';g.lineWidth=3;g.strokeRect(0,0,w,h)})};
const REP={wood:1.6,tile:.6,deck:1.2,stone:.8,bt:.6};
function box(x1,y1,x2,y2,h,c,y0=0,g=sc,r=.8){
  const m=new THREE.Mesh(new THREE.BoxGeometry((x2-x1)*S,h,(y2-y1)*S),mat(c,r));
  m.position.set(((x1+x2)/2-CX)*S,y0+h/2,((y1+y2)/2-CY)*S);m.castShadow=c!=='glass'&&!c?.emissive;m.receiveShadow=true;g.add(m);return m}
function cyl(cx,cy,rx,ry,h,c,y0=0,r=.7){const m=new THREE.Mesh(new THREE.CylinderGeometry(1,1,h,28),mat(c,r));
  m.scale.set(rx*S,1,ry*S);m.position.set((cx-CX)*S,y0+h/2,(cy-CY)*S);m.castShadow=!c?.emissive;m.receiveShadow=true;sc.add(m);return m}

const floorGroup=new THREE.Group();sc.add(floorGroup);
function floor(x1,y1,x2,y2,k,o=0){const t=TX[k].clone();t.needsUpdate=true;t.repeat.set((x2-x1)*S*REP[k]/2,(y2-y1)*S*REP[k]/2);
  const m=new THREE.MeshStandardMaterial({map:t,roughness:.6});const b=box(x1,y1,x2,y2,.1,m,-.1+o*.0008,floorGroup);b.castShadow=false}

// floors (原稿 CAD 座標)
[[245,682,650,1272,'wood'],[388,315,578,665,'bt'],[590,480,885,690,'bt'],[905,275,1175,460,'tile'],
[885,480,1245,695,'wood'],[608,690,1245,830,'wood'],[1245,310,1648,1272,'wood'],[912,830,1245,1272,'wood'],
[655,830,912,1272,'wood'],[1648,305,2040,510,'stone'],[1870,260,2040,305,'stone'],[1250,1290,1665,1472,'deck'],[388,665,608,682,'wood']]
.forEach((f,i)=>floor(...f,i));

// 牆體分組：矮牆結構 (wgLow) 與可切剖的高牆結構 (wgHigh)
const wgLow=new THREE.Group(),wgHigh=new THREE.Group();
sc.add(wgLow);sc.add(wgHigh);
const CUT_H=1.05;
function wall(x1,y1,x2,y2,c=0xe2dcd0,gaps=[]){
  const H=y1===y2,a=H?x1:y1,b=H?x2:y2,f=H?y1:x1;
  const seg=(p,q,y0,h,col)=>{
    if(q-p<1||h<=0)return;
    const y1Top=y0+h;
    if(y1Top<=CUT_H){
      H?box(p,f-T,q,f+T,h,col,y0,wgLow):box(f-T,p,f+T,q,h,col,y0,wgLow);
    }else if(y0>=CUT_H){
      H?box(p,f-T,q,f+T,h,col,y0,wgHigh):box(f-T,p,f+T,q,h,col,y0,wgHigh);
    }else{
      const h1=CUT_H-y0,h2=y1Top-CUT_H;
      H?box(p,f-T,q,f+T,h1,col,y0,wgLow):box(f-T,p,f+T,q,h1,col,y0,wgLow);
      H?box(p,f-T,q,f+T,h2,col,CUT_H,wgHigh):box(f-T,p,f+T,q,h2,col,CUT_H,wgHigh);
    }
  };
  const gl=(p,q,y0,h)=>{
    const grp=y0>=CUT_H?wgHigh:(y0+h<=CUT_H?wgLow:wgHigh);
    H?box(p,f-1.5,q,f+1.5,h,'glass',y0,grp):box(f-1.5,p,f+1.5,q,h,'glass',y0,grp);
  };
  const fr=(p,q,k)=>{
    const c2=0xe9e3d8,w=T+1.5;
    [[p-3,p],[q,q+3]].forEach(v=>{
      H?box(v[0],f-w,v[1],f+w,CUT_H,c2,0,wgLow):box(f-w,v[0],f+w,v[1],CUT_H,c2,0,wgLow);
      H?box(v[0],f-w,v[1],f+w,2.1-CUT_H,c2,CUT_H,wgHigh):box(f-w,v[0],f+w,v[1],2.1-CUT_H,c2,CUT_H,wgHigh);
    });
    H?box(p-3,f-w,q+3,f+w,.06,c2,2.1,wgHigh):box(f-w,p-3,f+w,q+3,.06,c2,2.1,wgHigh);
    if(k==='w')H?box(p-3,f-w-2,q+3,f+w+2,.05,c2,.88,wgLow):box(f-w-2,p-3,f+w+2,q+3,.05,c2,.88,wgLow);
  };
  let cur=a-T;
  gaps.sort((m,n)=>m[0]-n[0]).forEach(([p,q,k])=>{seg(cur,p,0,WH,c);
    if(k==='d')seg(p,q,2.1,WH-2.1,c);
    if(k==='w'){seg(p,q,0,.9,c);seg(p,q,2.1,WH-2.1,c);gl(p,q,.9,1.2);seg(p,q,.88,.04,0x555555)}
    if(k==='s'){seg(p,q,2.1,WH-2.1,c);gl(p,q,0,2.1);seg((p+q)/2-2,(p+q)/2+2,0,2.1,0x444444)}
    fr(p,q,k);cur=q});
  seg(cur,b+T,0,WH,c)}

const DK=0x6b6b6b;
[[243,670,390,670,DK],[243,670,243,1280,DK],
[243,1280,1670,1280,DK,[[395,640,'w'],[740,905,'w'],[935,1210,'w'],[1265,1640,'s']]],
[388,672,578,672,undefined,[[395,490,'d']]],[388,420,388,672],[388,310,585,310],[585,310,585,690],
[590,470,985,470],[985,470,1170,470,undefined,[[985,1170,'s']]],[1170,470,1245,470],
[885,480,885,695],[590,690,885,690,undefined,[[700,795,'d']]],
[895,262,1182,262,undefined,[[940,1140,'w']]],[895,262,895,470],[1182,262,1182,470],
[1245,300,1245,470],[1245,300,1648,300,DK],[1648,510,1648,1285,DK],
[1870,260,2040,260,DK],[1870,260,1870,305,DK],[1648,305,1870,305,DK],[2040,260,2040,510,DK,[[340,495,'d']]],[1648,510,2040,510,DK],
[608,682,608,822,undefined,[[701,809,'d']]],[608,822,652,822],[652,822,652,1280],[652,823,912,823,undefined,[[800,905,'s']]],[912,820,912,1280]
].forEach(w=>wall(w[0],w[1],w[2],w[3],w[4],w[5]));

// structural columns & beams (紅色虛線)
[[232,150,388,305],[1643,150,1870,310],[232,1280,385,1465],[605,1285,735,1330],[1612,1295,1668,1465]].forEach(c=>{
  box(...c,CUT_H,0x8c8c88,0,wgLow);
  box(...c,WH-CUT_H,0x8c8c88,CUT_H,wgHigh);
});
[[903,690,917,1270],[1678,310,1688,505],[1745,310,1755,505]].forEach(c=>box(...c,.4,0xd9a08a,2.05,wgHigh));

function leaf(x,y,len,th){
  [[0,CUT_H,wgLow],[CUT_H,2.05-CUT_H,wgHigh]].forEach(([y0,h,grp])=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(len*S,h,.04),mat(0xb78a5a));
    const g=new THREE.Group();m.position.set(len*S/2,y0+h/2,0);g.add(m);g.position.set((x-CX)*S,0,(y-CY)*S);g.rotation.y=th;grp.add(g);
  });
}
leaf(399,676,95,Math.PI/2);leaf(704,694,95,Math.PI/2);leaf(601,703,108,Math.PI);leaf(2036,495,155,Math.PI);

const gr=0xb5b2ab,wd=0xc59a68,wh=0xf4f2ee,cush=0xd9d6cf,or=0xc9814a;
function lb(w,h,d,x,y,z,c,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;p.add(m);return m}
function place(x,y,rot=0){const g=new THREE.Group();g.position.set((x-CX)*S,0,(y-CY)*S);g.rotation.y=rot;sc.add(g);return g}
function chair(x,y,rot,c=0xa88360){const g=place(x,y,rot);lb(.42,.05,.42,0,.45,0,c,g);lb(.42,.4,.04,0,.68,-.2,c,g);
  [[-.18,-.18],[.18,-.18],[-.18,.18],[.18,.18]].forEach(p=>lb(.04,.45,.04,p[0],.22,p[1],0x4a3a2c,g))}
function plant(x,y,s=1,y0=0){const g=place(x,y);g.position.y=y0;const pot=new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.12*s,.28*s,16),mat(0xe8e4dc));pot.position.y=.14*s;pot.castShadow=true;g.add(pot);
  for(let i=0;i<7;i++){const a=i/7*6.283,r=.12*s;const l=new THREE.Mesh(new THREE.SphereGeometry(.17*s,10,8),mat(i%2?0x3f7a35:0x5a9444));
   l.scale.set(.7,1.3,.35);l.position.set(Math.cos(a)*r,.5*s+(i%3)*.08,Math.sin(a)*r);l.rotation.set(Math.sin(a)*.5,-a,Math.cos(a)*.5);l.castShadow=true;g.add(l)}}
function doors(x1,x2,y1,y2,h,n,y0=0,c=0x8a7050){for(let i=1;i<n;i++){const x=x1+(x2-x1)*i/n;box(x-1.5,y1,x+1.5,y2,h,c,y0+.02)}}

function addDimLine(x1,y1,x2,y2,offX,offY,prefix='',alwaysTop=false){
  const lenCm=Math.round(Math.hypot(x2-x1,y2-y1)*S*100);
  const labelStr=`${prefix}${lenCm} cm`;
  const ax=(x1+offX-CX)*S,az=(y1+offY-CY)*S;
  const bx=(x2+offX-CX)*S,bz=(y2+offY-CY)*S;
  const ox=(x1-CX)*S,oz=(y1-CY)*S,px=(x2-CX)*S,pz=(y2-CY)*S;
  const y=.045;
  const lineMat=new THREE.LineBasicMaterial({color:0xc93b2b,depthTest:!alwaysTop});
  const extMat=new THREE.LineBasicMaterial({color:0xc93b2b,transparent:true,opacity:.5,depthTest:!alwaysTop});
  const addL=(p1,p2,m)=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1,p2]),m);if(alwaysTop)l.renderOrder=7;dims.add(l)};
  addL(new THREE.Vector3(ax,y,az),new THREE.Vector3(bx,y,bz),lineMat);
  addL(new THREE.Vector3(ox,y,oz),new THREE.Vector3(ax,y,az),extMat);
  addL(new THREE.Vector3(px,y,pz),new THREE.Vector3(bx,y,bz),extMat);
  const ang=Math.atan2(bz-az,bx-ax)+Math.PI/4,tk=.13;
  [[ax,az],[bx,bz]].forEach(([tx,tz])=>{
    addL(new THREE.Vector3(tx-Math.cos(ang)*tk,y,tz-Math.sin(ang)*tk),new THREE.Vector3(tx+Math.cos(ang)*tk,y,tz+Math.sin(ang)*tk),lineMat);
  });
  const c=document.createElement('canvas');c.width=260;c.height=64;const g=c.getContext('2d');
  g.fillStyle='rgba(255,250,245,.95)';g.fillRect(4,6,252,52);
  g.strokeStyle='#c93b2b';g.lineWidth=3;g.strokeRect(4,6,252,52);
  g.fillStyle='#b8291a';g.font='bold 28px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(labelStr,130,33);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));
  sp.scale.set(1.45,.36,1);sp.position.set((ax+bx)/2,.22,(az+bz)/2);sp.renderOrder=8;
  dims.add(sp);
}

function pick(n,keepCam=false){

}

  ray.setFromCamera(ptr,cam);
  if(labs.visible){
    const hitLab=ray.intersectObjects(labs.children,false);
    if(hitLab.length){pick(hitLab[0].object.userData.room);return;}
  }
  const hitFloor=ray.intersectObjects(floorGroup.children,false);
  if(hitFloor.length){
    const pt=hitFloor[0].point;
    const px=pt.x/S+CX,py=pt.z/S+CY;
    const found=RM.find(r=>px>=r[1]&&px<=r[3]&&py>=r[2]&&py<=r[4]);
    if(found){pick(found[0]);return;}
  }
  if(focus)pick(null);
});

// ===== 平移功能（操作模式切換 ＋ 方向鍵/螢幕方向按鈕） =====
let panMode=false;
$('mode').onclick=e=>{
  panMode=!panMode;
  ctl.mouseButtons.LEFT=panMode?THREE.MOUSE.PAN:THREE.MOUSE.ROTATE;
  ctl.touches.ONE=panMode?THREE.TOUCH.PAN:THREE.TOUCH.ROTATE;
  e.target.textContent=panMode?'✋ 模式:平移':'✋ 模式:旋轉';
  e.target.classList.toggle('on',panMode);
  $('t').textContent=panMode?'單指/左鍵拖曳平移 ・ 滾輪縮放':'拖曳旋轉 ・ 右鍵/雙指平移 ・ 滾輪縮放';
};

function panStep(dx,dz){
  const curTgt=goalTgt||ctl.target;
  const curPos=goalPos||cam.position;
  // 依目前視角水平方向計算前後左右向量
  const fwd=new THREE.Vector3();
  cam.getWorldDirection(fwd);
  fwd.y=0;
  if(fwd.lengthSq()<1e-5)fwd.set(0,0,-1);
  fwd.normalize();
  const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
  const dist=curPos.distanceTo(curTgt);
  const step=Math.max(.55,dist*.12);
  const delta=new THREE.Vector3().addScaledVector(right,dx*step).addScaledVector(fwd,-dz*step);
  flyTo(curPos.clone().add(delta),curTgt.clone().add(delta));
}
$('pl').onclick=()=>panStep(-1,0);
$('pr').onclick=()=>panStep(1,0);
$('pu').onclick=()=>panStep(0,-1);
$('pd').onclick=()=>panStep(0,1);

addEventListener('keydown',e=>{
  if($('printModal').classList.contains('open')){
    if(e.key==='Escape')$('printModal').classList.remove('open');
    return;
  }
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')panStep(-1,0);
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')panStep(1,0);
  else if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')panStep(0,-1);
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')panStep(0,1);
});

function dolly(f){
  const curTgt=goalTgt||ctl.target;
  const curPos=goalPos||cam.position;
  const v=curPos.clone().sub(curTgt).multiplyScalar(f);
  flyTo(curTgt.clone().add(v),curTgt);
}
function rot(a){
  const curTgt=goalTgt||ctl.target;
  const curPos=goalPos||cam.position;
  const v=curPos.clone().sub(curTgt);const c=Math.cos(a),s=Math.sin(a);
  flyTo(new THREE.Vector3(curTgt.x+v.x*c-v.z*s,curPos.y,curTgt.z+v.x*s+v.z*c),curTgt);
}
$('l').onclick=()=>rot(-.35);$('r').onclick=()=>rot(.35);
$('zi').onclick=()=>dolly(.8);$('zo').onclick=()=>dolly(1.25);
$('auto').onclick=e=>{ctl.autoRotate=!ctl.autoRotate;e.target.classList.toggle('on',ctl.autoRotate)};ctl.autoRotateSpeed=1.5;

let full=true;
$('wall').onclick=e=>{
  full=!full;
  wgHigh.visible=full;
  e.target.textContent=full?'牆體:全高':'牆體:矮牆';
  e.target.classList.toggle('on',full);
};

$('dimBtn').onclick=e=>{dims.visible=!dims.visible;e.target.classList.toggle('on',dims.visible)};
$('lab').onclick=e=>{labs.visible=!labs.visible;e.target.classList.toggle('on',labs.visible)};

$('eye').onclick=()=>{
  ctl.maxPolarAngle=Math.PI*.85;
  const r=RM.find(q=>q[0]===(focus||'客廳'));
  const cx=((r[1]+r[3])/2-CX)*S,cz=((r[2]+r[4])/2-CY)*S;
  flyTo(new THREE.Vector3(cx,1.65,cz+1.8),new THREE.Vector3(cx,1.25,cz-.6));
};

$('top').onclick=()=>{ctl.maxPolarAngle=Math.PI/2.03;flyTo(new THREE.Vector3(0,24,.05),new THREE.Vector3(0,0,0))};
$('iso').onclick=()=>iso(false);

// ===== 預覽列印功能 =====
let lastSnapUrl='';
$('printBtn').onclick=()=>{
  ctl.update();
  R.render(sc,cam);
  lastSnapUrl=cv.toDataURL('image/png');
  $('printImg').src=lastSnapUrl;

  const now=new Date();
  const dateStr=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  $('psMeta').innerHTML=`檢視區域：<strong>${focus||'全戶配置'}</strong><br>製表日期：${dateStr}`;
  $('psSummary').textContent=getSummaryText();

  const tbody=$('psBody');
  tbody.innerHTML='';
  RM.forEach(([name])=>{
    const s=roomStats[name];
    const tr=document.createElement('tr');
    if(focus===name)tr.className='hl';
    tr.innerHTML=`<td>${name}</td><td>${s.wCm} × ${s.dCm} cm</td><td>${s.m2} m²</td><td>約 ${s.ping} 坪</td>`;
    tbody.appendChild(tr);
  });
  const totalTr=document.createElement('tr');
  totalTr.style.fontWeight='700';
  totalTr.style.background='#f7f3ec';
  totalTr.innerHTML=`<td>全戶合計（概算）</td><td>—</td><td>${totalM2.toFixed(1)} m²</td><td>約 ${(totalM2*0.3025).toFixed(1)} 坪</td>`;
  tbody.appendChild(totalTr);

  $('printModal').classList.add('open');
};
$('closePrintBtn').onclick=()=>$('printModal').classList.remove('open');
$('printModal').onclick=e=>{if(e.target===$('printModal'))$('printModal').classList.remove('open')};
$('doPrintBtn').onclick=()=>window.print();
$('dlImgBtn').onclick=()=>{
  if(!lastSnapUrl)return;
  const a=document.createElement('a');
  a.href=lastSnapUrl;
  a.download=`平面配置3D_${focus||'全戶'}.png`;
  a.click();
};

function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

(function a(){
  requestAnimationFrame(a);
  if(goalPos&&goalTgt){
    cam.position.lerp(goalPos,.12);
    ctl.target.lerp(goalTgt,.12);
    if(cam.position.distanceTo(goalPos)<.01&&ctl.target.distanceTo(goalTgt)<.01){
      cam.position.copy(goalPos);ctl.target.copy(goalTgt);
      goalPos=null;goalTgt=null;
    }
  }
  ctl.update();
  R.render(sc,cam);
})();
